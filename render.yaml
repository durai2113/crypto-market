services:
  - type: web
    name: crypto-market-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false # User will provide this in the Render dashboard during setup
      - key: COINGECKO_URL
        value: https://api.coingecko.com/api/v3/coins/markets
      - key: CORS_ORIGINS
        value: "*"
      - key: PYTHONPATH
        value: .
